  <rect x="440" y="252" width="50" height="22" rx="3" stroke="#ef9f27" stroke-width="1"/>
  <text x="452" y="267" font-size="11" fill="#ef9f27">ida</text>

  <rect x="498" y="252" width="98" height="22" rx="3" stroke="#ef9f27" stroke-width="1"/>
  <text x="510" y="267" font-size="11" fill="#ef9f27">burp suite</text>

  <rect x="604" y="252" width="64" height="22" rx="3" class="tb" stroke-width="1"/>
